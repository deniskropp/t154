    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0f172a',
              surface: '#1e293b',
              primary: '#3b82f6',
              secondary: '#64748b',
              accent: '#06b6d4',
              success: '#10b981',
              warning: '#f59e0b',
              error: '#ef4444',
            }
          }
        }
      }

    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;

      ::-webkit-scrollbar {

      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>
